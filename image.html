<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Image Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="index.html">Google Search</a>
    </nav>
    <div class="main-container">
        <h1 style="font-size: 80px; margin-bottom: 25px; letter-spacing: -2px;">
            <span style="color: #4285f4;">Google</span> 
            <span style="font-size: 35px; color: #5f6368; font-weight: normal;">Images</span>
        </h1>
        <form action="https://www.google.com/search" method="GET" style="width: 100%; text-align: center;">
            <input type="hidden" name="tbm" value="isch">
            <input type="text" name="q" class="search-bar" autofocus>
            <div class="buttons">
                <input type="submit" value="Image Search" class="btn">
            </div>
        </form>
    </div>
</body>
</html>
