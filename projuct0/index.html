<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="image.html">Image Search</a>
        <a href="advanced.html">Advanced Search</a>
    </nav>
    <div class="main-container">
        <h1 style="font-size: 80px; margin-bottom: 25px; letter-spacing: -2px;">Google</h1>
        <form action="https://www.google.com/search" method="GET" style="width: 100%; text-align: center;">
            <input type="text" name="q" class="search-bar" autofocus>
            <div class="buttons">
                <input type="submit" value="Google Search" class="btn">
                <input type="submit" name="btnI" value="I'm Feeling Lucky" class="btn">
            </div>
        </form>
    </div>
</body>
</html>
