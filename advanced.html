<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Advanced Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="index.html">Google Search</a>
    </nav>
    
    <div class="adv-header">Advanced Search</div>
    
    <div class="adv-container">
        <hr style="border: 0; border-top: 1px solid #ebebeb; margin-bottom: 25px;">
        <p class="adv-title">Find pages with...</p>
        
        <form action="https://www.google.com/search" method="GET">
            <div class="adv-form-row">
                <label class="adv-label">all these words:</label>
                <input type="text" name="as_q" class="adv-input" autofocus>
            </div>
            
            <div class="adv-form-row">
                <label class="adv-label">this exact word or phrase:</label>
                <input type="text" name="as_epq" class="adv-input">
            </div>
            
            <div class="adv-form-row">
                <label class="adv-label">any of these words:</label>
                <input type="text" name="as_oq" class="adv-input">
            </div>
            
            <div class="adv-form-row">
                <label class="adv-label">none of these words:</label>
                <input type="text" name="as_eq" class="adv-input">
            </div>
            
            <div class="adv-submit-row">
                <input type="submit" value="Advanced Search" class="btn-blue">
            </div>
        </form>
    </div>
</body>
</html>
